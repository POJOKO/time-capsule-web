<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时间胶囊</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
    background: #f7f5f0;
    color: #2c2c2c;
    min-height: 100vh;
    line-height: 1.6;
  }
  #app {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }
  .view { animation: fadeIn 0.3s ease; }
  .hidden { display: none !important; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1 { font-size: 2.2em; margin-bottom: 8px; letter-spacing: 2px; }
  h2 { font-size: 1.5em; margin-bottom: 20px; }
  .subtitle { color: #999; margin-bottom: 40px; font-size: 0.95em; }

  /* 首页 */
  .home-actions { display: flex; flex-direction: column; gap: 14px; margin-top: 30px; }

  /* 按钮 */
  .btn {
    display: block;
    width: 100%;
    padding: 16px 24px;
    border: none;
    border-radius: 12px;
    font-size: 1em;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .btn-primary {
    background: #2c2c2c;
    color: #fff;
  }
  .btn-primary:hover { background: #000; transform: translateY(-1px); }
  .btn-secondary {
    background: #fff;
    color: #2c2c2c;
    border: 1px solid #e0ddd6;
  }
  .btn-secondary:hover { background: #f0ede6; }
  .btn-small {
    width: auto;
    padding: 8px 18px;
    font-size: 0.9em;
    border-radius: 8px;
    background: #2c2c2c;
    color: #fff;
    border: none;
    cursor: pointer;
  }
  .btn-small:disabled {
    background: #d0cdc6;
    cursor: not-allowed;
  }

  /* 表单 */
  form { display: flex; flex-direction: column; gap: 16px; }
  label {
    font-size: 0.9em;
    color: #666;
    display: block;
    margin-bottom: 6px;
  }
  input[type="text"],
  input[type="number"],
  input[type="password"],
  textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #e0ddd6;
    border-radius: 10px;
    font-family: inherit;
    font-size: 1em;
    background: #fff;
    transition: border-color 0.2s;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: #2c2c2c;
  }
  textarea { resize: vertical; min-height: 100px; }
  input[type="file"] {
    width: 100%;
    padding: 10px;
    border: 1px dashed #c0bdb6;
    border-radius: 10px;
    background: #fff;
    cursor: pointer;
  }
  .hint { font-size: 0.85em; color: #999; margin-top: 4px; }

  /* 列表 */
  .memory-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 20px;
    background: #fff;
    border-radius: 12px;
    margin-bottom: 12px;
    border: 1px solid #eae7e0;
    transition: all 0.2s;
  }
  .memory-item.unlocked { border-color: #2c2c2c; }
  .memory-item.locked { opacity: 0.85; }
  .memory-info { flex: 1; }
  .memory-meta {
    display: flex;
    gap: 12px;
    font-size: 0.85em;
    color: #999;
    margin-bottom: 4px;
  }
  .memory-meta span:last-child { color: #666; font-weight: 500; }
  .memory-date { font-size: 0.9em; color: #666; }
  .empty {
    text-align: center;
    color: #999;
    padding: 60px 20px;
    background: #fff;
    border-radius: 12px;
  }

  /* 详情 */
  .memory-time { color: #999; font-size: 0.9em; margin-bottom: 24px; }
  .content {
    background: #fff;
    padding: 24px;
    border-radius: 12px;
    margin-bottom: 20px;
    white-space: pre-wrap;
    line-height: 1.8;
  }
  .media-wrap { display: flex; flex-direction: column; gap: 16px; }
  .media {
    width: 100%;
    border-radius: 12px;
    display: block;
  }

  /* 加载 */
  .loading {
    text-align: center;
    padding: 20px;
    color: #999;
  }

  /* 同步 */
  .sync-box {
    margin-top: 34px;
    padding: 16px 18px;
    background: #fff;
    border: 1px dashed #d8d4cc;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    font-size: 0.9em;
    color: #666;
  }
  .sync-box .sync-state { flex: 1; min-width: 0; }
  .sync-box .sync-state b { color: #2c2c2c; font-weight: 600; }
  .sync-ok { color: #2f7d4f !important; }
  .sync-err { color: #b03a2e !important; }
  .sync-actions { margin-top: 8px; display: flex; flex-direction: column; gap: 12px; }

  /* 移动端 */
  @media (max-width: 480px) {
    #app { padding: 24px 16px 60px; }
    h1 { font-size: 1.8em; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- 首页 -->
  <section id="home-view" class="view">
    <h1>时间胶囊</h1>
    <p class="subtitle">把此刻，寄给未来</p>
    <div class="home-actions">
      <button class="btn btn-primary" onclick="showView('create')">存入回忆</button>
      <button class="btn btn-secondary" onclick="showView('list')">查看回忆</button>
    </div>

    <div class="sync-box" id="home-sync-box">
      <div class="sync-state" id="home-sync-state">同步未开启 · 仅保存在本机</div>
      <button class="btn-small" onclick="showView('sync')" id="home-sync-btn">开启同步</button>
    </div>
  </section>

  <!-- 存入回忆 -->
  <section id="create-view" class="view hidden">
    <h2>存入回忆</h2>
    <form id="create-form">
      <div>
        <label>标题</label>
        <input type="text" id="title" maxlength="50" placeholder="给这段回忆起个名字" required>
      </div>

      <div>
        <label>想说的话</label>
        <textarea id="content" maxlength="5000" placeholder="写点什么给未来的你们……"></textarea>
      </div>

      <div>
        <label>照片 / 视频</label>
        <input type="file" id="files" multiple accept="image/*,video/*">
        <p class="hint">支持多选。单个文件建议不超过 50MB，否则加密会较慢。</p>
      </div>

      <div>
        <label>多少天后可以查看</label>
        <input type="number" id="days" min="1" max="36500" value="365" required>
        <p class="hint">例如 365 就是一年后，1 就是明天。</p>
      </div>

      <div>
        <label>解锁密码</label>
        <input type="password" id="password" minlength="4" placeholder="至少 4 位，请务必记住" required>
        <p class="hint">密码只用于加密，不会上传。忘记密码将无法恢复。</p>
      </div>

      <button type="submit" class="btn btn-primary" id="submit-btn">存入时间胶囊</button>
      <button type="button" class="btn btn-secondary" onclick="showView('home')">返回</button>
    </form>
  </section>

  <!-- 查看回忆 -->
  <section id="list-view" class="view hidden">
    <h2>我的回忆</h2>
    <div id="memory-list"></div>
    <button class="btn btn-secondary" onclick="showView('home')" style="margin-top:20px;">返回</button>
  </section>

  <!-- 详情 -->
  <section id="detail-view" class="view hidden">
    <div id="detail-content"></div>
    <button class="btn btn-secondary" onclick="showView('list')" style="margin-top:20px;">返回列表</button>
  </section>

  <!-- 跨设备同步 -->
  <section id="sync-view" class="view hidden">
    <h2>跨设备同步</h2>
    <p class="hint" style="margin-bottom:22px;">
      在每台设备上填写<b>同一段同步口令</b>，即可看到彼此的胶囊。
      口令只用来区分你的数据空间，本身不会上传；胶囊内容仍由解锁密码加密，服务器只能看到密文。
    </p>

    <div>
      <label>同步口令</label>
      <input type="text" id="sync-code" maxlength="64" placeholder="例如：我和小雨的时光机-2026" style="margin-top:6px;">
      <p class="hint">自定义任意文字，越长越难猜。请记牢，丢了无法找回云端数据。</p>
    </div>

    <div class="sync-actions">
      <button class="btn btn-primary" onclick="enableSync()">保存口令并立即同步</button>
      <button class="btn btn-secondary" onclick="syncNow().then(refreshSyncUI)">立即同步一次</button>
      <button class="btn btn-secondary" onclick="disableSync()">本机关闭同步</button>
    </div>

    <div id="sync-status" class="hint" style="margin-top:16px; min-height:20px;"></div>

    <button class="btn btn-secondary" onclick="showView('home')" style="margin-top:12px;">返回</button>
  </section>

</div>

<script>
/* ============================================
   IndexedDB 封装
   ============================================ */
const DB_NAME = 'time-capsule';
const DB_VERSION = 1;
const STORE = 'memories';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) {
        db.createObjectStore(STORE, { keyPath: 'id' });
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}

async function dbPut(memory) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(memory);
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e.target.error);
  });
}

async function dbGetAll() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = e => reject(e.target.error);
  });
}

async function dbGet(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = e => reject(e.target.error);
  });
}

/* ============================================
   加密工具：PBKDF2 派生 + AES-256-GCM
   ============================================ */
async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function encryptText(plaintext, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const enc = new TextEncoder();
  const ciphertext = await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv },
    key,
    enc.encode(plaintext)
  );
  return { salt, iv, ciphertext };
}

async function decryptText(ciphertext, password, salt, iv) {
  const key = await deriveKey(password, salt);
  const plaintext = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv },
    key,
    ciphertext
  );
  return new TextDecoder().decode(plaintext);
}

/* ============================================
   工具函数
   ============================================ */
function arrayBufferToBase64(buffer) {
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function formatDate(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

/* ============================================
   跨设备同步（Supabase）
   表结构：capsules(id text pk, created_at timestamptz, space_id text, payload text)
   payload 里只有密文与时间戳，服务器看不到明文。
   ============================================ */
const SB_URL = 'https://kqdrivwvzlyptxyykujt.supabase.co';
const SB_KEY = 'sb_publishable_dKWqmoWpwZF2dCqGvklWMQ_tFYyDGoS';
const SYNC_CODE_KEY = 'tc_sync_code';
const SYNC_MAX_CHARS = 8 * 1024 * 1024; // 单条超过约 8MB 只留本机

function getSyncCode() {
  try { return localStorage.getItem(SYNC_CODE_KEY) || ''; } catch (e) { return ''; }
}

function setSyncCode(code) {
  try {
    if (code) localStorage.setItem(SYNC_CODE_KEY, code);
    else localStorage.removeItem(SYNC_CODE_KEY);
  } catch (e) { /* 隐私模式下忽略 */ }
}

function normalizeCode(code) {
  return String(code || '').trim().toLowerCase().replace(/\s+/g, ' ');
}

async function spaceIdFor(code) {
  const norm = normalizeCode(code);
  const data = new TextEncoder().encode('time-capsule/v1/' + norm);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf))
    .map(b => b.toString(16).padStart(2, '0'))
    .join('');
}

function bytesToB64(x) {
  let u8;
  if (x instanceof ArrayBuffer) u8 = new Uint8Array(x);
  else u8 = new Uint8Array(x.buffer, x.byteOffset || 0, x.byteLength);
  return arrayBufferToBase64(u8.buffer.slice(u8.byteOffset, u8.byteOffset + u8.byteLength));
}

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function memoryToRow(memory, spaceId) {
  return {
    id: memory.id,
    space_id: spaceId,
    payload: JSON.stringify({
      createdAt: memory.createdAt,
      unlockAt: memory.unlockAt,
      salt: bytesToB64(memory.salt),
      iv: bytesToB64(memory.iv),
      ciphertext: bytesToB64(memory.ciphertext)
    })
  };
}

function rowToMemory(row) {
  const p = JSON.parse(row.payload);
  return {
    id: row.id,
    createdAt: p.createdAt,
    unlockAt: p.unlockAt,
    salt: b64ToBytes(p.salt),
    iv: b64ToBytes(p.iv),
    ciphertext: b64ToBytes(p.ciphertext)
  };
}

async function sbFetch(path, options) {
  const opts = options || {};
  const res = await fetch(SB_URL + '/rest/v1/' + path, {
    method: opts.method || 'GET',
    headers: Object.assign({
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json'
    }, opts.headers || {}),
    body: opts.body
  });
  if (!res.ok) {
    let detail = '';
    try { detail = (await res.text()).slice(0, 160); } catch (e) {}
    throw new Error('HTTP ' + res.status + (detail ? ' · ' + detail : ''));
  }
  return res;
}

async function pushToCloud(memory, spaceId) {
  const row = memoryToRow(memory, spaceId);
  if (row.payload.length > SYNC_MAX_CHARS) return { skipped: true };
  await sbFetch('capsules', {
    method: 'POST',
    headers: { 'Prefer': 'resolution=ignore-duplicates,return=minimal' },
    body: JSON.stringify(row)
  });
  return { skipped: false };
}

function setSyncStatus(text, kind) {
  const el = document.getElementById('sync-status');
  if (el) {
    el.textContent = text;
    el.className = 'hint' + (kind === 'ok' ? ' sync-ok' : kind === 'err' ? ' sync-err' : '');
  }
  const homeText = document.getElementById('home-sync-state');
  if (homeText && kind) {
    homeText.textContent = text;
    homeText.className = 'sync-state' + (kind === 'ok' ? ' sync-ok' : kind === 'err' ? ' sync-err' : '');
  }
  const homeBox = document.getElementById('home-sync-box');
  if (homeBox && kind) {
    homeBox.setAttribute('data-state', kind);
  }
}

async function syncNow() {
  const code = getSyncCode();
  if (!code) {
    refreshSyncUI();
    return { configured: false };
  }
  setSyncStatus('同步中……');
  try {
    const spaceId = await spaceIdFor(code);
    const res = await sbFetch('capsules?space_id=eq.' + encodeURIComponent(spaceId) + '&select=id,payload');
    const rows = await res.json();

    const remoteIds = new Set(rows.map(r => r.id));
    const localBefore = await dbGetAll();
    const localIds = new Set(localBefore.map(m => m.id));

    let downloaded = 0;
    for (const row of rows) {
      if (localIds.has(row.id)) continue;
      try { await dbPut(rowToMemory(row)); downloaded++; }
      catch (e) { console.warn('跳过无法解析的云端记录', row.id, e); }
    }

    let uploaded = 0, skipped = 0;
    for (const m of localBefore) {
      if (remoteIds.has(m.id)) continue;
      try {
        const r = await pushToCloud(m, spaceId);
        if (r.skipped) skipped++; else uploaded++;
      } catch (e) { console.warn('上传失败', m.id, e); }
    }

    const total = localBefore.length + downloaded;
    const parts = ['已同步 · 共 ' + total + ' 条'];
    if (downloaded) parts.push('下载 ' + downloaded);
    if (uploaded) parts.push('上传 ' + uploaded);
    if (skipped) parts.push(skipped + ' 条过大仅本机');
    setSyncStatus(parts.join(' · '), 'ok');
    return { configured: true, total, downloaded, uploaded, skipped };
  } catch (err) {
    console.error(err);
    setSyncStatus('同步失败：' + (err.message || err), 'err');
    return { configured: true, error: String(err.message || err) };
  }
}

function refreshSyncUI() {
  const code = getSyncCode();
  const input = document.getElementById('sync-code');
  if (input && input.value !== code) input.value = code;

  const homeState = document.getElementById('home-sync-state');
  const homeBtn = document.getElementById('home-sync-btn');
  if (homeState) {
    if (code) {
      homeState.textContent = '已开启同步 · 换设备填同一口令即可';
      homeState.className = 'sync-state sync-ok';
    } else {
      homeState.textContent = '同步未开启 · 仅保存在本机';
      homeState.className = 'sync-state';
    }
  }
  if (homeBtn) homeBtn.textContent = code ? '同步设置' : '开启同步';
}

async function enableSync() {
  const input = document.getElementById('sync-code');
  const code = input ? input.value.trim() : '';
  if (code.length < 4) {
    setSyncStatus('同步口令至少 4 个字符', 'err');
    return;
  }
  setSyncCode(code);
  refreshSyncUI();
  await syncNow();
  refreshSyncUI();
}

async function disableSync() {
  setSyncCode('');
  refreshSyncUI();
  setSyncStatus('本机已关闭同步。云端已有的数据不会被删除，重新填入口令即可再次同步。');
}

function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
  document.getElementById(name + '-view').classList.remove('hidden');
  window.scrollTo(0, 0);
  if (name === 'list') renderList();
  if (name === 'list' && getSyncCode()) {
    syncNow().then(() => { renderList(); refreshSyncUI(); });
  }
  if (name === 'home' || name === 'sync') refreshSyncUI();
}

/* ============================================
   创建回忆
   ============================================ */
document.getElementById('create-form').addEventListener('submit', async e => {
  e.preventDefault();

  const title = document.getElementById('title').value.trim();
  const content = document.getElementById('content').value.trim();
  const days = parseInt(document.getElementById('days').value, 10);
  const password = document.getElementById('password').value;
  const filesInput = document.getElementById('files');
  const submitBtn = document.getElementById('submit-btn');

  if (!title || !password || !days) {
    alert('请填写标题、天数和密码');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = '加密中……';

  try {
    // 1. 读取文件为 base64
    const filesData = [];
    for (const file of filesInput.files) {
      // 单文件 50MB 限制
      if (file.size > 50 * 1024 * 1024) {
        throw new Error(`文件「${file.name}」超过 50MB，请压缩后再上传`);
      }
      const buffer = await file.arrayBuffer();
      filesData.push({
        name: file.name,
        type: file.type,
        data: arrayBufferToBase64(buffer)
      });
    }

    // 2. 打包成 JSON
    const payload = JSON.stringify({
      title,
      content,
      files: filesData
    });

    // 3. 加密
    const { salt, iv, ciphertext } = await encryptText(payload, password);

    // 4. 存入 IndexedDB
    const memory = {
      id: 'mem_' + Date.now() + '_' + Math.random().toString(36).slice(2),
      createdAt: Date.now(),
      unlockAt: Date.now() + days * 24 * 60 * 60 * 1000,
      salt,                                  // Uint8Array
      iv,                                    // Uint8Array
      ciphertext                             // ArrayBuffer
    };

    await dbPut(memory);

    // 5. 已开启同步则推到云端
    let syncNote = '';
    if (getSyncCode()) {
      submitBtn.textContent = '正在同步……';
      try {
        const spaceId = await spaceIdFor(getSyncCode());
        const r = await pushToCloud(memory, spaceId);
        if (r.skipped) syncNote = '\n（内容较大，仅保存在本机，未上传云端）';
      } catch (err) {
        console.warn(err);
        syncNote = '\n（云端同步失败，已保存在本机，稍后可在「同步」里重试）';
      }
    }

    alert(`已存入，${days} 天后可查看。${syncNote}`);
    e.target.reset();
    showView('list');
  } catch (err) {
    console.error(err);
    alert('保存失败：' + (err.message || err));
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = '存入时间胶囊';
  }
});

/* ============================================
   列表渲染
   ============================================ */
async function renderList() {
  const list = document.getElementById('memory-list');
  list.innerHTML = '<div class="loading">加载中……</div>';

  try {
    const memories = await dbGetAll();
    memories.sort((a, b) => b.createdAt - a.createdAt);

    if (memories.length === 0) {
      list.innerHTML = '<p class="empty">还没有回忆，去存入第一条吧。</p>';
      return;
    }

    const now = Date.now();

    list.innerHTML = memories.map(m => {
      const unlocked = now >= m.unlockAt;
      const daysLeft = Math.ceil((m.unlockAt - now) / (24 * 60 * 60 * 1000));
      const createdDate = formatDate(m.createdAt);
      const unlockDate = formatDate(m.unlockAt);

      return `
        <div class="memory-item ${unlocked ? 'unlocked' : 'locked'}">
          <div class="memory-info">
            <div class="memory-meta">
              <span>存入于 ${createdDate}</span>
              <span>${unlocked ? '可查看' : `还有 ${daysLeft} 天`}</span>
            </div>
            <div class="memory-date">解锁日期：${unlockDate}</div>
          </div>
          <button class="btn-small" ${unlocked ? '' : 'disabled'}
            onclick="openMemory('${m.id}')">
            ${unlocked ? '打开' : '未到期'}
          </button>
        </div>
      `;
    }).join('');
  } catch (err) {
    console.error(err);
    list.innerHTML = '<p class="empty">加载失败，请刷新重试。</p>';
  }
}

/* ============================================
   打开回忆
   ============================================ */
async function openMemory(id) {
  const memory = await dbGet(id);
  if (!memory) return;

  const now = Date.now();
  if (now < memory.unlockAt) {
    const daysLeft = Math.ceil((memory.unlockAt - now) / (24 * 60 * 60 * 1000));
    alert(`还没到期，还有 ${daysLeft} 天才能打开。`);
    return;
  }

  const password = prompt('请输入解锁密码');
  if (password === null) return;

  try {
    const plaintext = await decryptText(
      memory.ciphertext,
      password,
      memory.salt,
      memory.iv
    );
    const data = JSON.parse(plaintext);
    renderDetail(data, memory);
    showView('detail');
  } catch (err) {
    console.error(err);
    alert('密码错误，或数据已损坏。');
  }
}

/* ============================================
   详情渲染
   ============================================ */
function renderDetail(data, memory) {
  const container = document.getElementById('detail-content');

  let mediaHtml = '';
  (data.files || []).forEach(f => {
    if (f.type.startsWith('image/')) {
      mediaHtml += `<img src="data:${f.type};base64,${f.data}" alt="${escapeHtml(f.name)}" class="media">`;
    } else if (f.type.startsWith('video/')) {
      mediaHtml += `<video controls src="data:${f.type};base64,${f.data}" class="media"></video>`;
    }
  });

  container.innerHTML = `
    <h2>${escapeHtml(data.title)}</h2>
    <p class="memory-time">存入于 ${formatDate(memory.createdAt)}</p>
    ${data.content ? `<div class="content">${escapeHtml(data.content)}</div>` : ''}
    ${mediaHtml ? `<div class="media-wrap">${mediaHtml}</div>` : ''}
  `;
}

/* ============================================
   初始化
   ============================================ */
refreshSyncUI();
showView('home');
if (getSyncCode()) {
  syncNow().then(() => { refreshSyncUI(); });
}
